; Nexus IoT — ESP32 o ESP32-S3 contra Firebase Realtime Database
;
; Dos entornos, uno por chip (el mismo que elegiste en el portal, en
; Configurar > Tu placa):
;   pio run                 ESP32 clásico (esp32dev), el de siempre
;   pio run -e esp32s3      ESP32-S3
;
; Si tu placa no es una DevKit genérica, cambia 'board' en su entorno.
; Las más comunes:
;   esp32dev              DevKit v1 / NodeMCU-32S  (la que anda casi siempre)
;   esp32doit-devkit-v1   DOIT DevKit v1
;   nodemcu-32s           NodeMCU-32S
;   esp32-s3-devkitc-1    ESP32-S3 DevKitC-1 y parecidas (N8R8, N16R8...)
;   esp32-c3-devkitm-1    ESP32-C3

[platformio]
default_envs = esp32dev

; Lo que comparten los dos entornos
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

lib_deps =
    mobizt/FirebaseClient@^2.2.13
    bblanchon/ArduinoJson@^7.0.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    ; Solo se compilan si main.cpp las usa (PANTALLA 1 = OLED, 2 = LCD 16x2)
    adafruit/Adafruit SSD1306@^2.5.9
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; WiFi, WiFiClientSecure y Preferences ya vienen con el paquete
; ESP32: no se declaran acá.

; main.cpp va al repo con marcadores en lugar de tus datos. Tus datos reales
; van en src/secretos.h (no se sube: esta en .gitignore); main.cpp lo usa si
; existe. Esta linea deja afuera main.local.cpp, una copia vieja con datos, para
; que PlatformIO no intente compilar dos firmwares.
build_src_filter = +<*> -<main.local.cpp>

[env:esp32dev]
board = esp32dev

; ESP32-S3. El monitor serie sale por el USB que dice UART o COM. Si tu placa
; tiene un solo USB (o el monitor no muestra nada), descomenta build_flags.
; Si la placa tiene 4 MB de flash (dice N4), descomenta las dos de abajo.
[env:esp32s3]
board = esp32-s3-devkitc-1
; build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
; board_upload.flash_size = 4MB
; board_build.partitions = default.csv
