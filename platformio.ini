; Nexus IoT — ESP32 contra el backend propio (Supabase)
;
; Si tu placa no es una DevKit genérica, cambiá 'board'.
; Las más comunes:
;   esp32dev              DevKit v1 / NodeMCU-32S  (la que anda casi siempre)
;   esp32doit-devkit-v1   DOIT DevKit v1
;   nodemcu-32s           NodeMCU-32S
;   esp32-c3-devkitm-1    ESP32-C3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; WiFi, WiFiClientSecure, HTTPClient y Preferences ya vienen con el paquete
; ESP32: no se declaran acá.

; main.cpp va al repo con marcadores en lugar de tus datos. Si guardas una
; copia con los reales como src/main.local.cpp (no se sube: esta en
; .gitignore), esta linea evita que PlatformIO intente compilar las dos.
build_src_filter = +<*> -<main.local.cpp>
