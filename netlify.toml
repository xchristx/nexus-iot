# Netlify: sitio estatico puro, sin funciones serverless.
# Las cinco variables VITE_FIREBASE_* se cargan en el panel de Netlify:
#   Site configuration > Environment variables
# Vite las mete en el bundle al compilar: si cambian, hay que volver a desplegar.
[build]
  base    = "portal"
  command = "npm run build"
  publish = "dist"

# El portal es una sola pagina: cualquier ruta sirve el index.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
